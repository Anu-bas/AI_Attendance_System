<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Face Detection Attendance System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-card glass">
      <div class="auth-brand">
        <span class="brand-icon">◈</span>
        <h1>FaceAttend<span class="brand-accent">AI</span></h1>
        <p>AI Face Detection Attendance System</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="user@gmail.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>

</body>

</html>
